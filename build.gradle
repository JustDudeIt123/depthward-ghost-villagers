plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.depthward'
version = '1.1.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            args '--mixin.config', 'depthward_ghost_villagers.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }
        client { workingDirectory project.file('run'); mods { depthward_ghost_villagers { source sourceSets.main } } }
        clientSmoke {
            workingDirectory project.file('run-smoke')
            mods { depthward_ghost_villagers { source sourceSets.main; source sourceSets.clientSmoke } }
        }
        server { workingDirectory project.file('run-server'); args '--nogui'; mods { depthward_ghost_villagers { source sourceSets.main } } }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'depthward_ghost_villagers'
            mods { depthward_ghost_villagers { source sourceSets.main; source sourceSets.gameTest } }
        }
    }
}
minecraft.runs.clientSmoke.parent minecraft.runs.client
repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    flatDir { dirs '../mods' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    implementation fg.deobf('local:depthward-lanterns:1.2.3')
    implementation fg.deobf('local:curios:forge-5.14.1+1.20.1')
    if (!project.hasProperty('serverOnly')) {
        runtimeOnly fg.deobf('local:VIS-RyoamicLights:forge-0.2.3+mc1.20.1')
        runtimeOnly fg.deobf('local:API-ObsidianUI:forge-0.2.3+mc1.20.1')
        runtimeOnly fg.deobf('local:architectury:9.2.14-forge')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('createMixinSrg') {
    dependsOn 'createMcpToSrg'
    inputs.file "${buildDir}/createMcpToSrg/output.tsrg"
    outputs.file "${buildDir}/mixin/mcp-to-srg.srg"
    doLast {
        def output = file("${buildDir}/mixin/mcp-to-srg.srg")
        output.parentFile.mkdirs()
        net.minecraftforge.srgutils.IMappingFile.load(file("${buildDir}/createMcpToSrg/output.tsrg"))
            .write(output.toPath(), net.minecraftforge.srgutils.IMappingFile.Format.SRG, false)
    }
}
compileJava {
    dependsOn 'createMixinSrg'
    options.compilerArgs += [
        "-AreobfSrgFile=${buildDir}/mixin/mcp-to-srg.srg",
        "-AoutRefMapFile=${buildDir}/classes/java/main/depthward_ghost_villagers.refmap.json",
        "-AoutSrgFile=${buildDir}/mixin/mixins.srg"
    ]
}
tasks.matching { it.name == 'reobfJar' }.configureEach { extraMappings.from(file("${buildDir}/mixin/mixins.srg")) }
jar {
    manifest { attributes 'MixinConfigs': 'depthward_ghost_villagers.mixins.json' }
    finalizedBy 'reobfJar'
}

tasks.named('processResources') { from('LICENSE'); from('ASSETS.md') }
